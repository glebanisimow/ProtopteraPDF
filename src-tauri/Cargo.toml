[package]
name = "protoptera-pdf"
version = "0.1.0"
description = "Minimal local PDF reader for Windows"
edition = "2021"
rust-version = "1.99"

[lib]
name = "protoptera_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-store = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-window-state = "=2.5.0"
lopdf = { version = "=0.45.0", default-features = false }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
